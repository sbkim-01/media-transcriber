# config.toml 로 복사해서 쓰세요 (config.toml은 git에서 제외됨).
# run_qwen.bat 을 경로 없이 실행(더블클릭)하면 이 설정의 폴더를 전사합니다.
# 이미 .txt 결과가 있는 파일은 건너뛰므로 매번 그냥 다시 돌리면 새 파일만 처리됩니다.

# 학기 폴더 (작은따옴표 = 역슬래시 그대로)
root = 'D:\강의\2026_2학기'

# root 기준 강의영상 폴더 패턴. "**/" = 아래 어느 깊이든.
# 빈 목록 [] 이면 root 폴더 자체를 사용.
folders = ["**/1_강의영상"]

# false: 위 폴더 바로 안의 파일만 (작업완료_* 같은 하위 폴더는 건너뜀)
# true : 하위 폴더까지 모두
recursive = false
